<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#0c0c0e"/>
  <!-- Left lens -->
  <rect x="60" y="196" width="160" height="120" rx="28" fill="none" stroke="#c8f04f" stroke-width="22"/>
  <!-- Right lens -->
  <rect x="292" y="196" width="160" height="120" rx="28" fill="none" stroke="#c8f04f" stroke-width="22"/>
  <!-- Bridge -->
  <line x1="220" y1="256" x2="292" y2="256" stroke="#c8f04f" stroke-width="18" stroke-linecap="round"/>
  <!-- Left arm -->
